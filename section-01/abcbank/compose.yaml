services:
  # server:
  #   build:
  #     context: .
  #     target: final
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - SPRING_PROFILES_ACTIVE=prod
  #   restart: unless-stopped

  server-dev:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /build/src
        - action: sync+restart
          path: ./pom.xml
          target: /build/pom.xml
        - action: sync+restart
          path: ./mvnw
          target: /build/mvnw
          
          
    # volumes:
    #   - .:/build
    #   - ~/.m2:/root/.m2
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    command: ./mvnw spring-boot:run
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_DB=example
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=yourpassword
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:


